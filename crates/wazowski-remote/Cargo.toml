[package]
name = "wazowski-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
tokio = { workspace = true }
vnc-rs = "0.6"
# TLS for VNC VeNCrypt (X509) and RDP — rustls+ring (no system OpenSSL/cmake).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# RDP (native, in-window). Versions kept in lockstep with the `ironrdp` meta crate
# (connector 0.10 / session 0.11 / pdu 0.9). The connector's transitive `picky` is
# patched (see the workspace `[patch.crates-io]`) to drop a pre-release curve25519
# pin that otherwise conflicts with russh.
ironrdp = { version = "0.17", default-features = false, features = ["connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "pdu", "core"] }
ironrdp-tokio = "0.10"
# native-tls (system TLS) rather than rustls for RDP: rustls only negotiates
# ECDHE+AEAD cipher suites, which older Windows/SChannel RDP hosts (e.g. Server
# 2012-era, ECDHE-CBC + RSA-GCM only) don't offer — so rustls can't connect while
# FreeRDP/OpenSSL clients (Remmina) can. native-tls uses Security.framework on
# macOS and SChannel on Windows (no extra dep); on Linux it links system OpenSSL
# (build needs openssl headers + pkg-config; runtime needs libssl, both ubiquitous).
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
