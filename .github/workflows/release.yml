name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bin: wazowski
            ext: ""
          - os: macos-latest
            platform: macos-aarch64
            bin: wazowski
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            bin: wazowski.exe
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p wazowski-app

      - name: Stage artifact
        shell: bash
        run: |
          # Put the release tag (e.g. v0.1.0-beta.3) into the asset filename so
          # a downloaded binary announces its own version.
          asset="wazowski-${GITHUB_REF_NAME}-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
