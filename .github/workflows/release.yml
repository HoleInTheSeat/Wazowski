name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # TEMP (macOS-only test beta): skip the Linux/Windows raw-binary builds.
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bin: wazowski
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            bin: wazowski.exe
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p wazowski-app

      - name: Stage artifact
        shell: bash
        run: |
          # Put the release tag (e.g. v0.1.0-beta.3) into the asset filename so
          # a downloaded binary announces its own version.
          asset="wazowski-${GITHUB_REF_NAME}-${{ matrix.platform }}${{ matrix.ext }}"
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}

  package-linux:
    name: Package Linux (RPM + AppImage)
    # TEMP (macOS-only test beta): skip Linux packaging.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libssl-dev pkg-config \
            imagemagick wget file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p wazowski-app

      - name: Generate icons from icon.png
        run: |
          convert=$(command -v magick || command -v convert)
          for size in 16 32 48 64 128 256; do
            dir="packaging/linux/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            "$convert" icon.png -resize "${size}x${size}" "$dir/wazowski.png"
          done

      - name: Build RPM
        run: |
          cargo install cargo-generate-rpm --locked
          # RPM versions can't contain '-' (it separates version from release), so a
          # SemVer pre-release like 2.6.0-beta.2 uses '~' in the RPM version — which
          # also sorts *before* the final 2.6.0, exactly as a pre-release should.
          rpmver="${GITHUB_REF_NAME#v}"
          tilde='~'  # a variable so bash doesn't tilde-expand the replacement
          rpmver="${rpmver//-/$tilde}"
          # Run from the workspace root so the asset source paths resolve;
          # disable auto-req (host is Ubuntu, target is Fedora — sonames differ).
          cargo generate-rpm -p crates/wazowski-app --auto-req disabled -s "version = \"$rpmver\""
          mkdir -p dist
          rpm=$(ls target/generate-rpm/*.rpm | head -1)
          cp "$rpm" "dist/wazowski-${GITHUB_REF_NAME}-linux-x86_64.rpm"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp target/release/wazowski AppDir/usr/bin/
          cp packaging/linux/wazowski.desktop AppDir/usr/share/applications/
          for size in 16 32 48 64 128 256; do
            d="AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$d"
            cp "packaging/linux/icons/hicolor/${size}x${size}/apps/wazowski.png" "$d/"
          done
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d packaging/linux/wazowski.desktop \
            -i packaging/linux/icons/hicolor/256x256/apps/wazowski.png \
            --output appimage
          mkdir -p dist
          img=$(ls ./*.AppImage | grep -iv linuxdeploy | head -1)
          cp "$img" "dist/wazowski-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: wazowski-linux-packages
          path: dist/*

  package-windows:
    name: Package Windows (installer)
    # TEMP (macOS-only test beta): skip Windows packaging.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p wazowski-app

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # Stage the payload next to the .iss (it references wazowski.exe / icon.ico).
          Copy-Item target/release/wazowski.exe packaging/windows/wazowski.exe
          $version = "${{ github.ref_name }}" -replace '^v',''
          # Inno Setup ships on the hosted Windows runners.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$version" packaging/windows/wazowski.iss
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/windows/Output/Wazowski-Setup.exe "dist/wazowski-${{ github.ref_name }}-windows-x86_64-setup.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: wazowski-windows-installer
          path: dist/*

  package-macos:
    name: Package macOS (.app + .dmg)
    runs-on: macos-latest
    # macOS arm64 hosted runners are frequently capacity-constrained; don't let a
    # missing macOS runner block the Linux/Windows release. Re-run this job later
    # to backfill the macOS assets (see docs/releasing.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p wazowski-app

      - name: Assemble .app, ad-hoc sign, and build .dmg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="Wazowski.app"

          # icon.png -> wazowski.icns (all the sizes macOS wants)
          mkdir -p Wazowski.iconset
          for pair in "16 16x16" "32 16x16@2x" "32 32x32" "64 32x32@2x" \
                      "128 128x128" "256 128x128@2x" "256 256x256" \
                      "512 256x256@2x" "512 512x512" "1024 512x512@2x"; do
            set -- $pair
            sips -z "$1" "$1" icon.png --out "Wazowski.iconset/icon_$2.png" >/dev/null
          done
          iconutil -c icns Wazowski.iconset -o wazowski.icns

          # bundle layout
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/wazowski "$app/Contents/MacOS/wazowski"
          chmod +x "$app/Contents/MacOS/wazowski"
          cp wazowski.icns "$app/Contents/Resources/wazowski.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>Wazowski</string>
          <key>CFBundleDisplayName</key><string>Wazowski</string>
          <key>CFBundleIdentifier</key><string>org.wazowski.wazowski</string>
          <key>CFBundleExecutable</key><string>wazowski</string>
          <key>CFBundleIconFile</key><string>wazowski</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${version}</string>
          <key>CFBundleVersion</key><string>${version}</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign: arm64 binaries must carry at least an ad-hoc signature to
          # run. This does NOT remove the Gatekeeper warning (that needs a paid
          # Developer ID + notarization) — it just lets the app launch once allowed.
          codesign --force --sign - "$app/Contents/MacOS/wazowski"
          codesign --force --sign - "$app"

          mkdir -p dist
          # Raw binary (what the in-app updater matches on: *-macos-aarch64).
          cp target/release/wazowski "dist/wazowski-${GITHUB_REF_NAME}-macos-aarch64"

          # .dmg with an Applications shortcut for drag-to-install, plus a
          # first-launch note (the app is unsigned/un-notarized, so Gatekeeper
          # warns once) shown right in the opened disk image.
          mkdir -p dmgroot
          cp -R "$app" dmgroot/
          ln -s /Applications dmgroot/Applications
          cat > "dmgroot/How to open Wazowski (first launch).txt" <<'READ'
          Wazowski isn't signed with a paid Apple certificate, so on FIRST launch
          macOS will warn - and may only offer "Move to Trash". This is expected,
          not an actual problem with the app.

          To open it:
            1. Drag Wazowski into the Applications folder (shown here).
            2. In Applications, RIGHT-CLICK Wazowski -> Open -> Open.
               If macOS still refuses: open System Settings -> Privacy & Security,
               scroll to the message about Wazowski, and click "Open Anyway".

          You only need to do this once. An update may prompt the same way.
          READ
          hdiutil create -volname "Wazowski" -srcfolder dmgroot -ov -format UDZO \
            "dist/wazowski-${GITHUB_REF_NAME}-macos-aarch64.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wazowski-macos
          path: dist/*

  release:
    name: Publish release
    needs: [build, package-linux, package-windows, package-macos]
    # Publish as long as the Linux packaging succeeded, even if `package-macos`
    # never got a runner (a frequent macOS arm64 capacity issue). The Linux and
    # Windows artifacts still publish; the macOS .app/.dmg + binary are included
    # if that job managed to run, and can be backfilled by re-running it later.
    # TEMP (macOS-only test beta): publish when the macOS job succeeded (Linux is
    # skipped). Restore `needs.package-linux.result == 'success'` for full releases.
    if: ${{ !cancelled() && needs.package-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
