name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like Wazowski to do. Mentioning how MobaXterm or another tool handles it is helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
