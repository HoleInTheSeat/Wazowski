name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version (e.g. v0.1.0-beta.1) or the git commit you built.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Release binary
        - Built from source
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        If it's a connection issue, the "Copy log" button on the connecting tab
        captures the handshake. Otherwise, output from running with
        `RUST_LOG=debug` helps.
      render: shell
