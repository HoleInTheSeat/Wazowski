[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
eframe = "0.36"
egui = "0.36"
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
wazowski-term = { path = "crates/wazowski-term" }
