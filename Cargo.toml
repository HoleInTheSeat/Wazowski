[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
eframe = "0.36"
egui = "0.36"
regex = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
serialport = { version = "4", default-features = false }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
keyring = "4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
base64 = "0.22"
open = "5"
self-replace = "1"
thiserror = "2"
russh = { version = "0.64", features = ["des"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "macros", "time", "fs", "process", "io-std"] }
futures = "0.3"
dirs = "6"
wazowski-ssh = { path = "crates/wazowski-ssh" }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace"] }
async-tftp = "0.4"
if-addrs = "0.15"
wazowski-servers = { path = "crates/wazowski-servers" }

rfd = "0.15"
wazowski-core = { path = "crates/wazowski-core" }
wazowski-term = { path = "crates/wazowski-term" }
wazowski-remote = { path = "crates/wazowski-remote" }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# Vendored vnc-rs with VncClient::new / AuthHelper exposed, so wazowski-remote can
# run the RFB handshake itself (needed for VeNCrypt + TLS, which upstream lacks).
[patch.crates-io]
vnc-rs = { path = "vendor/vnc-rs" }
# picky rc.25 with its `curve25519-dalek =5.0.0-rc.1` pin relaxed to `^5`, so
# ironrdp's connector can coexist with russh (which needs curve25519-dalek ^5).
# Same crate version (7.0.0-rc.25), so it still satisfies ironrdp's exact req.
picky = { path = "vendor/picky" }
# sspi rc.X with the same pre-release crypto pins relaxed, for the same reason.
sspi = { path = "vendor/sspi" }
