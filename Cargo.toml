[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
eframe = "0.36"
egui = "0.36"
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
keyring = "4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
base64 = "0.22"
thiserror = "2"
russh = { version = "0.64", features = ["des"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "macros", "time", "fs"] }
futures = "0.3"
dirs = "6"
wazowski-ssh = { path = "crates/wazowski-ssh" }
rfd = "0.15"
wazowski-core = { path = "crates/wazowski-core" }
wazowski-term = { path = "crates/wazowski-term" }

[profile.release]
strip = true
lto = "thin"
